  detail_image_width: 480
  detail_image_height: 958
  image_caption: Original customer app mockups · Home and business storefront · sample data
  link_text: Ask me about Omari
  url: mailto:caleb.grimah@gmail.com?subject=Omari%20project
  summary: A platform for Nigerian businesses, bringing bookings, commerce, payments, delivery, and analytics together across customer, business, and rider experiences.
  overview: I’m building Omari around the everyday operations of service and retail businesses. A customer can discover a business, book a service or place an order, while the business manages its catalog, schedule, fulfillment, and reporting from connected tools.
  stack: Kotlin Multiplatform / Compose Multiplatform / React / Spring Boot
  highlights:
    - label: Business workflows
      text: Product catalogs, inventory, orders, appointments, reservations, and staff scheduling for different kinds of businesses.
    - label: Connected experiences
      text: Customer, business, and rider applications connect ordering and bookings with payments, delivery, and operational reporting.
    - label: Shared foundations
      text: Kotlin Multiplatform and Compose Multiplatform applications, React web and administrative interfaces, and Kotlin/Spring Boot backend services.
