- id: astera
  title: Astera
  image: /assets/images/projects/astera-dashboard.webp
  image_alt: Astera brand workspace with campaign budgets, performance charts, and creator activity
  image_width: 1200
  image_height: 779
  detail_image: /assets/images/projects/astera-mobile.webp
  detail_image_alt: Astera creator app showing earnings, campaigns, and available briefs
  detail_image_width: 360
  detail_image_height: 803
  image_caption: Brand workspace and creator app design previews · sample data
  url: https://astera.africa
  link_text: Explore Astera
  summary: A creator-marketing platform connecting brands and creators in Nigeria. Campaign briefs, content review, results tracking, and payments in one workspace.
  overview: I’m building Astera to connect the full campaign workflow, from a brand’s brief and budget to creator submissions, performance checks, and payouts. Separate brand, creator, and administrative experiences share the same campaign and payment systems.
  stack: React / React Native / TypeScript / Kotlin / Spring Boot
  highlights:
    - label: Campaign operations
      text: Briefs, eligibility rules, budgets, creator applications, and submission review, with approval and correction workflows.
    - label: Measurement and money
      text: Results tracking, campaign spending limits, transaction history, and creator wallets that separate pending earnings from available funds.
    - label: Across platforms
      text: A React web workspace, React Native mobile application, and administrative tools connected to Kotlin and Spring Boot services.
- id: omari
  title: Omari
  image: /assets/images/projects/omari-mobile.webp
