  summary: A website I built for ArcadeReality, a senior engineering studio. It brings together engineering services, product case studies, technical writing, and a project inquiry flow.
  overview: I built ArcadeReality’s public website to give the engineering studio a clear home for its services, work, and technical perspective. Visitors can explore engagement options, read case studies for Astera, Omari, and MakersMark, browse engineering articles, and outline a project through a structured inquiry form.
  stack: Responsive web / Case studies / Technical publishing / Project inquiries
  highlights:
    - label: Studio capabilities
      text: Six engagement tracks covering product engineering, infrastructure, AI systems, security, legacy modernization, and platform development, alongside the studio’s delivery process.
    - label: Work and technical writing
      text: Product case studies and engineering articles covering architecture, Kotlin Multiplatform, commerce systems, payments, and integrations.
    - label: Responsive project discovery
      text: Desktop and mobile layouts, an interactive code presentation, and an inquiry form that collects the engagement track, budget range, timeline, project brief, and optional attachment.
