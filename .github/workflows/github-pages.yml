name: Build and deploy thenorthstar site to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate site
    runs-on: ubuntu-24.04
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --trace
      - name: Validate generated site and custom domain
        run: |
          python3 scripts/check_site.py
          test -s _site/assets/css/main.css
          test "$(cat _site/CNAME)" = "thenorthstar.tech"
          touch _site/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: built-site
          path: _site/
          include-hidden-files: true
          retention-days: 3

  deploy:
    name: Publish to gh-pages
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: built-site
          path: _site
      - name: Publish existing Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          cname: thenorthstar.tech
