

title: thenorthstar
author: Caleb Grimah
email: caleb.grimah@gmail.com
description: Caleb Grimah — software engineer building across mobile, web, backend, and connected TV.
baseurl: ""
url: "https://thenorthstar.tech"
twitter_username: lamar.grimah
github_username:  calebgrimah


# Build settings
# The original minimal theme styles are maintained locally in _sass/.

theme_config:
  appearance: "light"
  back_home_text: ".." # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page


plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-seo-tag


include:
  - _pages
  - CNAME
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Keep build tools and full-resolution source media out of the published site.
exclude:
  - .jekyll-cache
  - .sass-cache
  - vendor
  - Gemfile
  - Gemfile.lock
  - assets/images/caleb-grimah-profile-original.JPG
  - README.md
  - scripts
sass:
  style: compressed
